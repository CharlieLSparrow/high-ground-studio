packages:
  - apps/*
  - packages/*

allowBuilds:
  '@ffmpeg-installer/darwin-arm64': true
  '@firebase/util': true
  '@google/genai': true
  '@prisma/engines': true
  electron: true
  electron-winstaller: true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - prisma
  - sharp
