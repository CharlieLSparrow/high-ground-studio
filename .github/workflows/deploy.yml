name: Legacy GHCR image publish (manual only)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Legacy GHCR image to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - web
          - quipsly

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_WEB: ${{ github.repository }}-web
  IMAGE_NAME_STUDIO: ${{ github.repository }}-studio

jobs:
  build-and-deploy:
    name: Build and Deploy Next.js Apps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Web
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'web'
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}

      - name: Build and push Web Docker image
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'web'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

      - name: Extract metadata for Quipsly
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'quipsly'
        id: meta-studio
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_STUDIO }}

      - name: Build and push Quipsly Docker image
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'quipsly'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/quipsly/Dockerfile
          push: true
          tags: ${{ steps.meta-studio.outputs.tags }}
          labels: ${{ steps.meta-studio.outputs.labels }}
