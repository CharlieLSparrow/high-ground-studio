name: PR Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Git ref to compare with the selected branch (for example origin/main).
        required: true
        default: origin/main
        type: string

concurrency:
  group: quipsly-pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run Quipsly Validation
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quipsly_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quipsly_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve validation comparison
        id: comparison
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MANUAL_BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          if [[ -n "${PR_BASE_SHA}" ]]; then
            base=$(git rev-parse --verify --end-of-options "${PR_BASE_SHA}^{commit}")
          else
            requested=$(git rev-parse --verify --end-of-options "${MANUAL_BASE_REF}^{commit}")
            base=$(git merge-base "${requested}" HEAD)
          fi
          echo "base_sha=${base}" >> "${GITHUB_OUTPUT}"
          echo "Validating $(git rev-parse HEAD) against ${base}"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Check release shell syntax before dependency installation
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            scripts/release/materialize-release-context.sh \
            scripts/release/materialize-release-context.test.sh \
            scripts/release/hgo-web-build-image.sh \
            scripts/release/quipsly-deploy-preview.sh \
            scripts/release/quipsly-promote-preview.sh \
            scripts/release/quipsly-hotfix-deploy.sh; do
            bash -n "$script"
          done

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Verify collaborator and documentation contract
        run: |
          node --test scripts/ci/audit-repository-contract.test.mjs
          node --test scripts/ci/pr-contract-lane.test.mjs
          node --test scripts/ci/verify-required-jest-results.test.mjs
          node --test scripts/sync-prisma-pnpm-clients.test.mjs
          node scripts/ci/audit-repository-contract.mjs
          node --test scripts/ci/audit-tracked-artifacts.test.mjs
          node scripts/ci/audit-tracked-artifacts.mjs
          node --test \
            scripts/dev/quipsly-local-doctor.test.mjs \
            scripts/dev/quipsly-local-lifecycle.test.mjs
          pnpm release:manifests:audit
          node --experimental-strip-types --test packages/repository-governance/src/release-manifest.test.ts

      - name: Reject added secret material
        env:
          BASE_SHA: ${{ steps.comparison.outputs.base_sha }}
        run: |
          node --test scripts/ci/audit-changed-secrets.test.mjs
          node scripts/ci/audit-changed-secrets.mjs --base "${BASE_SHA}" --head HEAD

      - name: Enforce binary asset budgets
        env:
          BASE_SHA: ${{ steps.comparison.outputs.base_sha }}
        run: node scripts/ci/audit-binary-assets.mjs --base "${BASE_SHA}" --head HEAD

      - name: Detect Quipsly release-slice changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ steps.comparison.outputs.base_sha }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/ci/plan-changed-surfaces.mjs \
            --base "${BASE_SHA}" \
            --head HEAD \
            --github-output "${GITHUB_OUTPUT}"

      - name: Install and verify media test tools
        if: steps.changes.outputs.quipsly == 'true' || steps.changes.outputs.web == 'true'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        if: steps.changes.outputs.quipsly == 'true' || steps.changes.outputs.web == 'true' || steps.changes.outputs.media_verifier == 'true' || steps.changes.outputs.media_processor == 'true' || steps.changes.outputs.transcript_worker == 'true'
        run: pnpm install --frozen-lockfile

      - name: Test membership and persistence on a fresh database
        if: steps.changes.outputs.quipsly == 'true'
        timeout-minutes: 10
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/quipsly_ci
          QUIPSLY_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/quipsly_ci
          QUIPSLY_LOCAL_DB_SMOKE: '1'
        run: |
          set -o pipefail
          pnpm exec prisma migrate deploy 2>&1 | tee "${RUNNER_TEMP}/quipsly-db-migrations.log"
          suites=(
            src/lib/server/project-actions-access.integration.test.ts
            'src/app/(app)/create/assistant-mutations.integration.test.ts'
            src/lib/server/studio-project-access.integration.test.ts
            src/lib/server/canonical-document-note-edit.integration.test.ts
            src/lib/server/nest-project-follow-through.integration.test.ts
            src/app/api/nest-chat/route.integration.test.ts
            src/lib/server/nest-conversation-task.integration.test.ts
            src/lib/server/quipsly-core.integration.test.ts
            src/lib/server/coaching-engagement.integration.test.ts
            src/app/api/coaching/runway/route.integration.test.ts
            src/lib/server/session-access.integration.test.ts
            src/lib/server/session-work.integration.test.ts
            src/lib/server/session-transcript-analysis-job.integration.test.ts
            src/lib/server/capture-transcript-follow-through-worker.integration.test.ts
            src/lib/server/work-queue-task-access.integration.test.ts
            src/app/api/mobile/capture/transcripts/packet/transcript-work.integration.test.ts
            'src/app/api/coaching/engagements/[engagementId]/work/route.integration.test.ts'
          )
          pnpm --filter quipsly --fail-if-no-match test --runInBand --json --outputFile="${RUNNER_TEMP}/quipsly-db-tests.json" --runTestsByPath "${suites[@]}" \
            2>&1 | tee "${RUNNER_TEMP}/quipsly-db-tests.log"
          node scripts/ci/verify-required-jest-results.mjs "${RUNNER_TEMP}/quipsly-db-tests.json" apps/quipsly "${suites[@]}" \
            2>&1 | tee -a "${RUNNER_TEMP}/quipsly-db-tests.log"

      - name: Preserve database test results
        if: always() && steps.changes.outputs.quipsly == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quipsly-database-tests-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/quipsly-db-migrations.log
            ${{ runner.temp }}/quipsly-db-tests.json
            ${{ runner.temp }}/quipsly-db-tests.log
          if-no-files-found: warn
          retention-days: 7

      - name: Test Quipsly application behavior
        if: steps.changes.outputs.quipsly == 'true'
        timeout-minutes: 10
        env:
          QUIPSLY_LOCAL_DB_SMOKE: '0'
        run: |
          node --test apps/quipsly/scripts/typescript-config.test.mjs
          set -o pipefail
          pnpm --filter quipsly --fail-if-no-match test --maxWorkers=2 --json --outputFile="${RUNNER_TEMP}/quipsly-jest-results.json" 2>&1 | tee "${RUNNER_TEMP}/quipsly-jest.log"

      - name: Preserve application test results
        if: always() && steps.changes.outputs.quipsly == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quipsly-application-tests-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/quipsly-jest-results.json
            ${{ runner.temp }}/quipsly-jest.log
          if-no-files-found: warn
          retention-days: 7

      - name: Typecheck High Ground web with pinned TypeScript 7
        if: steps.changes.outputs.web == 'true'
        run: pnpm --filter web --fail-if-no-match typecheck

      - name: Typecheck Quipsly with pinned TypeScript 7
        if: steps.changes.outputs.quipsly == 'true'
        run: pnpm --filter quipsly --fail-if-no-match typecheck

      - name: Verify Session recording evidence
        if: steps.changes.outputs.quipsly == 'true'
        run: pnpm quipsly:session-evidence:test

      - name: Build and fault-test Quipsly media verifier
        if: steps.changes.outputs.media_verifier == 'true'
        run: |
          pnpm --filter @high-ground/quipsly-capture-verification --fail-if-no-match typecheck
          pnpm quipsly:media-verifier:build
          pnpm quipsly:media-verifier:test

      - name: Build and fault-test Quipsly media processor
        if: steps.changes.outputs.media_processor == 'true'
        run: |
          pnpm --filter @high-ground/quipsly-media-processing --fail-if-no-match typecheck
          pnpm quipsly:media-processor:build
          pnpm quipsly:media-processor:test

      - name: Build and fault-test Quipsly transcript worker
        if: steps.changes.outputs.transcript_worker == 'true'
        run: |
          pnpm --filter @high-ground/quipsly-media-processing --fail-if-no-match typecheck
          pnpm quipsly:transcript-worker:build
          pnpm quipsly:transcript-worker:test

      - name: Run committed Quipsly contract suite
        if: steps.changes.outputs.quipsly == 'true' || steps.changes.outputs.web == 'true'
        timeout-minutes: 5
        run: |
          set -o pipefail
          pnpm quipsly:contracts:test 2>&1 | tee "${RUNNER_TEMP}/quipsly-contracts.log"

      - name: Preserve contract test results
        if: always() && (steps.changes.outputs.quipsly == 'true' || steps.changes.outputs.web == 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quipsly-contract-tests-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quipsly-contracts.log
          if-no-files-found: warn
          retention-days: 7

      - name: Test CI and coaching release-gate behavior
        if: steps.changes.outputs.quipsly == 'true' || steps.changes.outputs.web == 'true'
        run: |
          node --test scripts/ci/pr-contract-lane.test.mjs scripts/ci/verify-required-jest-results.test.mjs scripts/hgo-quipsly-coaching-handoff-static-smoke.test.mjs

      - name: Run source and production-build release gate
        if: steps.changes.outputs.quipsly == 'true' || steps.changes.outputs.web == 'true'
        run: pnpm quipsly:release:local

      - name: Validate release scripts and workflows
        if: steps.changes.outputs.quipsly == 'true' || steps.changes.outputs.media_verifier == 'true' || steps.changes.outputs.media_processor == 'true' || steps.changes.outputs.transcript_worker == 'true'
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/deploy-cloud-run.yml"); YAML.load_file(".github/workflows/pr-tests.yml"); puts "YAML OK"'
          node --test scripts/ci/audit-binary-assets.test.mjs
          node --experimental-strip-types --test scripts/ci/plan-changed-surfaces.test.mjs
          node --test scripts/quipsly-foundation-baseline-audit.test.mjs
          node --experimental-strip-types scripts/quipsly-livekit-join-token-contract.test.mjs
          bash -n scripts/release/quipsly-build-context.sh
          bash -n scripts/release/quipsly-build-context.test.sh
          bash -n scripts/release/materialize-release-context.sh
          bash -n scripts/release/materialize-release-context.test.sh
          bash -n scripts/release/quipsly-normalize-context-metadata.sh
          bash -n scripts/release/quipsly-media-verifier-access.sh
          bash -n scripts/release/quipsly-media-verifier-context.test.sh
          bash -n scripts/release/quipsly-media-verifier-deploy.sh
          bash -n scripts/release/quipsly-media-processor-access.sh
          bash -n scripts/release/quipsly-media-processor-context.test.sh
          bash -n scripts/release/quipsly-media-processor-deploy.sh
          bash -n scripts/release/quipsly-transcript-worker-access.sh
          bash -n scripts/release/quipsly-transcript-worker-context.test.sh
          bash -n scripts/release/quipsly-transcript-worker-deploy.sh
          node --check scripts/release/quipsly-transcript-worker-cloud-fixture.mjs
          bash -n scripts/release/quipsly-release-preflight.sh
          node --test scripts/release/quipsly-verify-release-build.test.mjs
          node --test scripts/release/quipsly-canonical-deploy-entrypoints.test.mjs
          bash -n scripts/release/quipsly-smoke-preview.sh
          bash -n scripts/release/quipsly-production-status.sh
          node --test scripts/release/quipsly-production-status.test.mjs
          node --test scripts/quipsly-mobile-capture-contract-smoke.test.mjs
          node --test scripts/release/quipsly-app-store-connect-readback.test.mjs
          node --test scripts/release/quipsly-capture-app-store-metadata.test.mjs
          node scripts/release/quipsly-capture-app-store-metadata.mjs
          bash -n scripts/release/quipsly-schema-sync.sh
          bash scripts/release/quipsly-schema-sync.test.sh
          bash scripts/release/quipsly-schema-context.test.sh
          bash scripts/release/quipsly-schema-job.test.sh
          bash -n scripts/release/quipsly-schema-release.sh
          bash scripts/release/quipsly-schema-release.test.sh
          node --test scripts/release/quipsly-cloud-sql-backup-readback.test.mjs
          bash -n scripts/release/quipsly-deploy-preview.sh
          bash -n scripts/release/quipsly-promote-preview.sh
          bash scripts/release/materialize-release-context.test.sh nest

      - name: Validate committed media-verifier release context
        if: steps.changes.outputs.media_verifier == 'true'
        run: bash scripts/release/quipsly-media-verifier-context.test.sh

      - name: Validate committed media-processor release context
        if: steps.changes.outputs.media_processor == 'true'
        run: bash scripts/release/quipsly-media-processor-context.test.sh

      - name: Validate committed transcript-worker release context
        if: steps.changes.outputs.transcript_worker == 'true'
        run: bash scripts/release/quipsly-transcript-worker-context.test.sh

      - name: Validate committed Quipsly release context
        if: steps.changes.outputs.quipsly == 'true'
        run: bash scripts/release/quipsly-build-context.test.sh

      - name: Validate committed HGO web release context
        if: steps.changes.outputs.web == 'true'
        run: |
          node --test scripts/web-cloud-run-readiness.test.mjs
          bash -n scripts/release/materialize-release-context.sh
          bash -n scripts/release/materialize-release-context.test.sh
          bash -n scripts/release/hgo-web-build-image.sh
          bash scripts/release/materialize-release-context.test.sh hgo-web

      - name: Report intentionally skipped Quipsly validation
        if: steps.changes.outputs.quipsly != 'true' && steps.changes.outputs.web != 'true'
        run: echo "PASS This pull request does not change the Nest or High Ground web release slice."
