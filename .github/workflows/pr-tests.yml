name: PR Tests

on:
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: quipsly-pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run Quipsly Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Verify collaborator and documentation contract
        run: |
          node --test scripts/ci/audit-repository-contract.test.mjs
          node scripts/ci/audit-repository-contract.mjs
          node --test scripts/ci/audit-tracked-artifacts.test.mjs
          node scripts/ci/audit-tracked-artifacts.mjs
          node --test \
            scripts/dev/quipsly-local-doctor.test.mjs \
            scripts/dev/quipsly-local-lifecycle.test.mjs
          pnpm release:manifests:audit

      - name: Reject added secret material
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --test scripts/ci/audit-changed-secrets.test.mjs
          node scripts/ci/audit-changed-secrets.mjs --base "${BASE_SHA}" --head HEAD

      - name: Enforce binary asset budgets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci/audit-binary-assets.mjs --base "${BASE_SHA}" --head HEAD

      - name: Detect Quipsly release-slice changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/ci/plan-changed-surfaces.mjs \
            --base "${BASE_SHA}" \
            --head HEAD \
            --github-output "${GITHUB_OUTPUT}"

      - name: Install dependencies
        if: steps.changes.outputs.quipsly == 'true' || steps.changes.outputs.web == 'true' || steps.changes.outputs.media_verifier == 'true' || steps.changes.outputs.media_processor == 'true' || steps.changes.outputs.transcript_worker == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck High Ground web with pinned TypeScript 7
        if: steps.changes.outputs.web == 'true'
        run: pnpm --filter web typecheck

      - name: Typecheck Quipsly with pinned TypeScript 7
        if: steps.changes.outputs.quipsly == 'true'
        run: pnpm --filter quipsly typecheck

      - name: Verify Session recording evidence
        if: steps.changes.outputs.quipsly == 'true'
        run: pnpm quipsly:session-evidence:test

      - name: Build and fault-test Quipsly media verifier
        if: steps.changes.outputs.media_verifier == 'true'
        run: |
          pnpm --filter @high-ground/quipsly-capture-verification typecheck
          pnpm quipsly:media-verifier:build
          pnpm quipsly:media-verifier:test

      - name: Build and fault-test Quipsly media processor
        if: steps.changes.outputs.media_processor == 'true'
        run: |
          pnpm --filter @high-ground/quipsly-media-processing typecheck
          pnpm quipsly:media-processor:build
          pnpm quipsly:media-processor:test

      - name: Build and fault-test Quipsly transcript worker
        if: steps.changes.outputs.transcript_worker == 'true'
        run: |
          pnpm --filter @high-ground/quipsly-media-processing typecheck
          pnpm quipsly:transcript-worker:build
          pnpm quipsly:transcript-worker:test

      - name: Run committed Quipsly contract suite
        if: steps.changes.outputs.quipsly == 'true' || steps.changes.outputs.web == 'true'
        run: pnpm quipsly:contracts:test

      - name: Run source and production-build release gate
        if: steps.changes.outputs.quipsly == 'true' || steps.changes.outputs.web == 'true'
        run: pnpm quipsly:release:local

      - name: Validate release scripts and workflows
        if: steps.changes.outputs.quipsly == 'true' || steps.changes.outputs.media_verifier == 'true' || steps.changes.outputs.media_processor == 'true' || steps.changes.outputs.transcript_worker == 'true'
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/deploy-cloud-run.yml"); YAML.load_file(".github/workflows/pr-tests.yml"); puts "YAML OK"'
          node --test scripts/ci/audit-binary-assets.test.mjs
          node --experimental-strip-types --test scripts/ci/plan-changed-surfaces.test.mjs
          node --test scripts/quipsly-foundation-baseline-audit.test.mjs
          node --experimental-strip-types scripts/quipsly-livekit-join-token-contract.test.mjs
          bash -n scripts/release/quipsly-build-context.sh
          bash -n scripts/release/quipsly-build-context.test.sh
          bash -n scripts/release/materialize-release-context.sh
          bash -n scripts/release/materialize-release-context.test.sh
          bash -n scripts/release/quipsly-normalize-context-metadata.sh
          bash -n scripts/release/quipsly-media-verifier-access.sh
          bash -n scripts/release/quipsly-media-verifier-context.test.sh
          bash -n scripts/release/quipsly-media-verifier-deploy.sh
          bash -n scripts/release/quipsly-media-processor-access.sh
          bash -n scripts/release/quipsly-media-processor-context.test.sh
          bash -n scripts/release/quipsly-media-processor-deploy.sh
          bash -n scripts/release/quipsly-transcript-worker-access.sh
          bash -n scripts/release/quipsly-transcript-worker-context.test.sh
          bash -n scripts/release/quipsly-transcript-worker-deploy.sh
          node --check scripts/release/quipsly-transcript-worker-cloud-fixture.mjs
          bash -n scripts/release/quipsly-release-preflight.sh
          bash -n scripts/release/quipsly-smoke-preview.sh
          bash -n scripts/release/quipsly-production-status.sh
          node --test scripts/release/quipsly-production-status.test.mjs
          node --test scripts/release/quipsly-app-store-connect-readback.test.mjs
          node --test scripts/release/quipsly-capture-app-store-metadata.test.mjs
          node scripts/release/quipsly-capture-app-store-metadata.mjs
          bash -n scripts/release/quipsly-schema-sync.sh
          bash scripts/release/quipsly-schema-sync.test.sh
          bash scripts/release/quipsly-schema-context.test.sh
          bash scripts/release/quipsly-schema-job.test.sh
          bash -n scripts/release/quipsly-deploy-preview.sh
          bash -n scripts/release/quipsly-promote-preview.sh
          bash scripts/release/materialize-release-context.test.sh nest

      - name: Validate committed media-verifier release context
        if: steps.changes.outputs.media_verifier == 'true'
        run: bash scripts/release/quipsly-media-verifier-context.test.sh

      - name: Validate committed media-processor release context
        if: steps.changes.outputs.media_processor == 'true'
        run: bash scripts/release/quipsly-media-processor-context.test.sh

      - name: Validate committed transcript-worker release context
        if: steps.changes.outputs.transcript_worker == 'true'
        run: bash scripts/release/quipsly-transcript-worker-context.test.sh

      - name: Validate committed Quipsly release context
        if: steps.changes.outputs.quipsly == 'true'
        run: bash scripts/release/quipsly-build-context.test.sh

      - name: Validate committed HGO web release context
        if: steps.changes.outputs.web == 'true'
        run: |
          node --test scripts/web-cloud-run-readiness.test.mjs
          bash -n scripts/release/materialize-release-context.sh
          bash -n scripts/release/materialize-release-context.test.sh
          bash -n scripts/release/hgo-web-build-image.sh
          bash scripts/release/materialize-release-context.test.sh hgo-web

      - name: Report intentionally skipped Quipsly validation
        if: steps.changes.outputs.quipsly != 'true' && steps.changes.outputs.web != 'true'
        run: echo "PASS This pull request does not change the Nest or High Ground web release slice."
