name: Capture iPhone Tests

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - apps/mobile-capture/HighGroundCapture/**
      - docs/quipsly/ios-capture-app-review-notes-draft.md
      - docs/quipsly/ios-capture-app-store-listing.md
      - docs/quipsly/ios-capture-app-store-readiness.md
      - docs/quipsly/hgo-testflight-rehearsal-runbook.md
      - docs/quipsly/ios-capture-privacy-label-matrix.md
      - docs/quipsly/ios-capture-reviewer-smoke-checklist.md
      - release/app-store/quipsly-capture/**
      - release/manifests/capture.json
      - scripts/quipsly-ios-capture-app-store-static-smoke.mjs
      - scripts/release/quipsly-app-store-connect-readback.mjs
      - scripts/release/quipsly-app-store-connect-readback.test.mjs
      - scripts/release/quipsly-app-store-connect-assign-build.mjs
      - scripts/release/quipsly-app-store-connect-assign-build.test.mjs
      - scripts/release/quipsly-app-store-connect-external-beta.mjs
      - scripts/release/quipsly-app-store-connect-external-beta.test.mjs
      - scripts/release/quipsly-capture-app-store-metadata.mjs
      - scripts/release/quipsly-capture-app-store-metadata.test.mjs
      - scripts/release/quipsly-capture-release-target.mjs
      - scripts/release/quipsly-capture-release-target.test.mjs
      - scripts/release/quipsly-testflight-public-link-readback.mjs
      - scripts/release/quipsly-testflight-public-link-readback.test.mjs
      - .github/workflows/capture-pr-tests.yml
  workflow_dispatch:

concurrency:
  group: capture-iphone-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-ui:
    name: Deterministic iPhone UX
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      CAPTURE_PROJECT: apps/mobile-capture/HighGroundCapture/HighGroundCapture.xcodeproj
      CAPTURE_SCHEME: HighGroundCapture
      CAPTURE_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prove pinned Apple toolchain
        run: |
          set -euo pipefail
          test -d "${DEVELOPER_DIR}"
          xcodebuild -version
          xcrun simctl list devices available

      - name: Validate Capture release source
        run: |
          bash apps/mobile-capture/HighGroundCapture/scripts/verify-release-source.sh
          node scripts/quipsly-ios-capture-app-store-static-smoke.mjs
          node --test scripts/release/quipsly-app-store-connect-readback.test.mjs
          node --test scripts/release/quipsly-app-store-connect-assign-build.test.mjs
          node --test scripts/release/quipsly-app-store-connect-external-beta.test.mjs
          node --test scripts/release/quipsly-capture-app-store-metadata.test.mjs
          node --test scripts/release/quipsly-capture-release-target.test.mjs
          node --test scripts/release/quipsly-testflight-public-link-readback.test.mjs
          node scripts/release/quipsly-capture-app-store-metadata.mjs

      - name: Prewarm deterministic simulator services
        run: bash apps/mobile-capture/HighGroundCapture/scripts/prepare-ci-simulator.sh "iPhone 17 Pro" "26.2"

      - name: Run deterministic Capture UI suite serially
        run: |
          set -euo pipefail
          result_bundle="${RUNNER_TEMP}/capture-ui-tests.xcresult"
          build_log="${RUNNER_TEMP}/capture-ui-tests.log"

          xcodebuild \
            -project "${CAPTURE_PROJECT}" \
            -scheme "${CAPTURE_SCHEME}" \
            -destination "${CAPTURE_DESTINATION}" \
            -parallel-testing-enabled NO \
            -resultBundlePath "${result_bundle}" \
            -only-testing:HighGroundCaptureUITests/CaptureExperienceUITests \
            -only-testing:HighGroundCaptureUITests/CaptureLoginExperienceUITests \
            -only-testing:HighGroundCaptureUITests/ShareCaptureExtensionUITests \
            test | tee "${build_log}"

      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capture-iphone-test-evidence-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/capture-ui-tests.xcresult
            ${{ runner.temp }}/capture-ui-tests.log
          if-no-files-found: warn
          retention-days: 14
