name: Capture iPhone and iPad Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      depth:
        description: UI test depth. Critical is the fast review gate; full runs all coverage-proven shards.
        required: true
        default: critical
        type: choice
        options:
          - critical
          - full

concurrency:
  group: capture-apple-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Capture changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      capture: ${{ steps.plan.outputs.capture }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Test Capture CI routing
        run: node --experimental-strip-types --test scripts/ci/capture-ci-routing.test.mjs scripts/ci/plan-changed-surfaces.test.mjs packages/repository-governance/src/release-manifest.test.ts apps/mobile-capture/HighGroundCapture/scripts/warm-local-runtime.test.mjs

      - name: Plan Capture validation
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "capture=true" >> "${GITHUB_OUTPUT}"
          else
            base=$(git rev-parse --verify --end-of-options "${PR_BASE_SHA}^{commit}")
            node --experimental-strip-types scripts/ci/plan-changed-surfaces.mjs \
              --base "${base}" --head HEAD --github-output "${GITHUB_OUTPUT}"
          fi

  deterministic-ui:
    needs: changes
    if: needs.changes.outputs.capture == 'true'
    name: Deterministic Apple UX (${{ matrix.shard == 0 && 'critical' || format('full {0}/4', matrix.shard) }})
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.depth == 'full' && '[1,2,3,4]' || '[0]') }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      CAPTURE_PROJECT: apps/mobile-capture/HighGroundCapture/HighGroundCapture.xcodeproj
      CAPTURE_SCHEME: HighGroundCapture
      CAPTURE_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2
      CAPTURE_IPAD_DESTINATION: platform=iOS Simulator,name=iPad Air 13-inch (M3),OS=26.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prove pinned Apple toolchain
        run: |
          set -euo pipefail
          test -d "${DEVELOPER_DIR}"
          xcodebuild -version
          xcrun simctl list devices available

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Validate Capture release source
        if: matrix.shard == 0 || matrix.shard == 1
        shell: bash
        run: |
          set -euo pipefail
          bash apps/mobile-capture/HighGroundCapture/scripts/verify-release-source.sh
          bash scripts/test-capture-session-deep-links.sh
          bash apps/mobile-capture/HighGroundCapture/scripts/test-coaching-work-save.sh
          node apps/mobile-capture/HighGroundCapture/scripts/test-recording-content-summary.mjs
          node --test scripts/lib/source-check-report.test.mjs scripts/quipsly-ios-capture-app-store-static-smoke.test.mjs
          node scripts/quipsly-ios-capture-app-store-static-smoke.mjs --summary
          node --test scripts/release/quipsly-capture-ui-test-plan.test.mjs
          node --test scripts/release/quipsly-capture-ui-test-runner.test.mjs
          node --test scripts/release/quipsly-app-store-connect-readback.test.mjs
          node --test scripts/release/quipsly-app-store-connect-assign-build.test.mjs
          node --test scripts/release/quipsly-app-store-connect-external-beta.test.mjs
          node --test scripts/release/quipsly-capture-app-store-metadata.test.mjs
          node --test apps/mobile-capture/HighGroundCapture/scripts/app-store-draft-screenshots.test.mjs
          node --test scripts/release/quipsly-capture-qualify-app-store-screenshots.test.mjs
          node --test scripts/release/quipsly-app-store-connect-screenshots.test.mjs
          node --test scripts/release/quipsly-capture-privacy-questionnaire.test.mjs
          node --test scripts/release/quipsly-capture-physical-install-readback.test.mjs
          node --test scripts/release/quipsly-capture-release-target.test.mjs
          node --test scripts/release/quipsly-testflight-public-link-readback.test.mjs
          node --test scripts/release/quipsly-xcode-cloud-workflow-audit.test.mjs
          node --test scripts/quipsly-hgo-rehearsal-preflight.test.mjs
          bash -n scripts/quipsly-hgo-rehearsal-live-preflight.sh
          node scripts/release/quipsly-capture-app-store-metadata.mjs
          node scripts/release/quipsly-capture-privacy-questionnaire.mjs --strict

      - name: Prewarm deterministic simulator services
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          bash apps/mobile-capture/HighGroundCapture/scripts/prepare-ci-simulator.sh "iPhone 17 Pro" "26.2" 2>&1 | tee "${RUNNER_TEMP}/capture-prewarm-iphone.log"
          bash apps/mobile-capture/HighGroundCapture/scripts/prepare-ci-simulator.sh "iPad Air 13-inch (M3)" "26.2" 2>&1 | tee "${RUNNER_TEMP}/capture-prewarm-ipad.log"

      - name: Run bounded deterministic Capture UI lane serially
        run: |
          set -euo pipefail
          if [[ "${{ matrix.shard }}" == "0" ]]; then
            suite="critical"
            shard="1"
          else
            suite="full"
            shard="${{ matrix.shard }}"
          fi
          evidence_root="${RUNNER_TEMP}/capture-ui-${suite}-${shard}"
          build_log="${evidence_root}/capture-ui-tests.log"
          mkdir -p "${evidence_root}"
          node scripts/release/quipsly-capture-ui-test-runner.mjs \
            --suite="${suite}" \
            --shard="${shard}" \
            --shards=4 \
            --destination="${CAPTURE_DESTINATION}" \
            --ipad-destination="${CAPTURE_IPAD_DESTINATION}" \
            --derived-data="${RUNNER_TEMP}/capture-ui-derived-${shard}" \
            --evidence-root="${evidence_root}" \
            2>&1 | tee "${build_log}"

      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capture-apple-test-evidence-${{ github.run_attempt }}-${{ matrix.shard == 0 && 'critical' || format('full-{0}-of-4', matrix.shard) }}
          path: |
            ${{ runner.temp }}/capture-prewarm-*.log
            ${{ runner.temp }}/capture-ui-*/*.xcresult
            ${{ runner.temp }}/capture-ui-*/capture-ui-tests.log
          if-no-files-found: warn
          retention-days: 14

  validation:
    name: Capture validation
    needs: [changes, deterministic-ui]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report Capture validation
        env:
          PLAN_RESULT: ${{ needs.changes.result }}
          CAPTURE_CHANGED: ${{ needs.changes.outputs.capture }}
          UI_RESULT: ${{ needs.deterministic-ui.result }}
        run: |
          set -euo pipefail
          if [[ "${PLAN_RESULT}" != "success" ]]; then
            echo "FAIL Capture change detection did not succeed."
            exit 1
          fi
          if [[ "${CAPTURE_CHANGED}" == "false" ]]; then
            echo "PASS No Capture changes; native tests were not needed."
          elif [[ "${CAPTURE_CHANGED}" == "true" && "${UI_RESULT}" == "success" ]]; then
            echo "PASS Capture simulator tests passed. Device and delivery proof are separate."
          else
            echo "FAIL Required Capture tests did not succeed (${UI_RESULT})."
            exit 1
          fi
