name: Capture iPhone Tests

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - apps/mobile-capture/HighGroundCapture/**
      - docs/quipsly/ios-capture-app-review-notes-draft.md
      - docs/quipsly/ios-capture-app-store-listing.md
      - docs/quipsly/ios-capture-app-store-readiness.md
      - docs/quipsly/hgo-testflight-rehearsal-runbook.md
      - docs/quipsly/ios-capture-privacy-label-matrix.md
      - docs/quipsly/ios-capture-reviewer-smoke-checklist.md
      - docs/quipsly/xcode-cloud-usage-policy.md
      - release/app-store/quipsly-capture/**
      - release/manifests/capture.json
      - scripts/quipsly-ios-capture-app-store-static-smoke.mjs
      - scripts/quipsly-hgo-rehearsal-live-preflight.sh
      - scripts/quipsly-hgo-rehearsal-preflight.mjs
      - scripts/quipsly-hgo-rehearsal-preflight.test.mjs
      - scripts/release/quipsly-app-store-connect-readback.mjs
      - scripts/release/quipsly-app-store-connect-readback.test.mjs
      - scripts/release/quipsly-app-store-connect-assign-build.mjs
      - scripts/release/quipsly-app-store-connect-assign-build.test.mjs
      - scripts/release/quipsly-app-store-connect-external-beta.mjs
      - scripts/release/quipsly-app-store-connect-external-beta.test.mjs
      - scripts/release/quipsly-capture-app-store-metadata.mjs
      - scripts/release/quipsly-capture-app-store-metadata.test.mjs
      - scripts/release/quipsly-capture-privacy-questionnaire.mjs
      - scripts/release/quipsly-capture-privacy-questionnaire.test.mjs
      - scripts/release/quipsly-capture-physical-install-readback.mjs
      - scripts/release/quipsly-capture-physical-install-readback.test.mjs
      - scripts/release/quipsly-capture-ui-test-plan.mjs
      - scripts/release/quipsly-capture-ui-test-plan.test.mjs
      - scripts/release/quipsly-capture-release-target.mjs
      - scripts/release/quipsly-capture-release-target.test.mjs
      - scripts/release/quipsly-testflight-public-link-readback.mjs
      - scripts/release/quipsly-testflight-public-link-readback.test.mjs
      - scripts/release/quipsly-xcode-cloud-workflow-audit.mjs
      - scripts/release/quipsly-xcode-cloud-workflow-audit.test.mjs
      - .github/workflows/capture-pr-tests.yml
  workflow_dispatch:
    inputs:
      depth:
        description: UI test depth. Critical is the fast review gate; full runs all coverage-proven shards.
        required: true
        default: critical
        type: choice
        options:
          - critical
          - full

concurrency:
  group: capture-iphone-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-ui:
    name: Deterministic iPhone UX (${{ matrix.shard == 0 && 'critical' || format('full {0}/4', matrix.shard) }})
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.depth == 'full' && '[1,2,3,4]' || '[0]') }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      CAPTURE_PROJECT: apps/mobile-capture/HighGroundCapture/HighGroundCapture.xcodeproj
      CAPTURE_SCHEME: HighGroundCapture
      CAPTURE_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prove pinned Apple toolchain
        run: |
          set -euo pipefail
          test -d "${DEVELOPER_DIR}"
          xcodebuild -version
          xcrun simctl list devices available

      - name: Validate Capture release source
        if: matrix.shard == 0 || matrix.shard == 1
        run: |
          bash apps/mobile-capture/HighGroundCapture/scripts/verify-release-source.sh
          node scripts/quipsly-ios-capture-app-store-static-smoke.mjs
          node --test scripts/release/quipsly-capture-ui-test-plan.test.mjs
          node --test scripts/release/quipsly-app-store-connect-readback.test.mjs
          node --test scripts/release/quipsly-app-store-connect-assign-build.test.mjs
          node --test scripts/release/quipsly-app-store-connect-external-beta.test.mjs
          node --test scripts/release/quipsly-capture-app-store-metadata.test.mjs
          node --test apps/mobile-capture/HighGroundCapture/scripts/app-store-draft-screenshots.test.mjs
          node --test scripts/release/quipsly-capture-qualify-app-store-screenshots.test.mjs
          node --test scripts/release/quipsly-app-store-connect-screenshots.test.mjs
          node --test scripts/release/quipsly-capture-privacy-questionnaire.test.mjs
          node --test scripts/release/quipsly-capture-physical-install-readback.test.mjs
          node --test scripts/release/quipsly-capture-release-target.test.mjs
          node --test scripts/release/quipsly-testflight-public-link-readback.test.mjs
          node --test scripts/release/quipsly-xcode-cloud-workflow-audit.test.mjs
          node --test scripts/quipsly-hgo-rehearsal-preflight.test.mjs
          bash -n scripts/quipsly-hgo-rehearsal-live-preflight.sh
          node scripts/release/quipsly-capture-app-store-metadata.mjs
          node scripts/release/quipsly-capture-privacy-questionnaire.mjs --strict

      - name: Prewarm deterministic simulator services
        run: bash apps/mobile-capture/HighGroundCapture/scripts/prepare-ci-simulator.sh "iPhone 17 Pro" "26.2"

      - name: Run bounded deterministic Capture UI lane serially
        run: |
          set -euo pipefail
          if [[ "${{ matrix.shard }}" == "0" ]]; then
            suite="critical"
            shard="1"
          else
            suite="full"
            shard="${{ matrix.shard }}"
          fi
          evidence_root="${RUNNER_TEMP}/capture-ui-${suite}-${shard}"
          result_bundle="${evidence_root}/capture-ui-tests.xcresult"
          build_log="${evidence_root}/capture-ui-tests.log"
          mkdir -p "${evidence_root}"
          only_testing_args=()
          while IFS= read -r selector; do
            only_testing_args+=("-only-testing:${selector}")
          done < <(node scripts/release/quipsly-capture-ui-test-plan.mjs \
            --suite="${suite}" \
            --shard="${shard}" \
            --shards=4 \
            --format=lines)
          test "${#only_testing_args[@]}" -gt 0

          xcodebuild \
            -project "${CAPTURE_PROJECT}" \
            -scheme "${CAPTURE_SCHEME}" \
            -destination "${CAPTURE_DESTINATION}" \
            -parallel-testing-enabled NO \
            -resultBundlePath "${result_bundle}" \
            "${only_testing_args[@]}" \
            test | tee "${build_log}"

      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capture-iphone-test-evidence-${{ github.run_attempt }}-${{ matrix.shard == 0 && 'critical' || format('full-{0}-of-4', matrix.shard) }}
          path: |
            ${{ runner.temp }}/capture-ui-*/capture-ui-tests.xcresult
            ${{ runner.temp }}/capture-ui-*/capture-ui-tests.log
          if-no-files-found: warn
          retention-days: 14
