name: Deploy Cloud Run

on:
  workflow_dispatch:
    inputs:
      target:
        description: Cloud Run service to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - web
          - studio
          - auto
      apply_schema_changes:
        description: Apply committed migrations and targeted additive schema syncs
        required: true
        default: false
        type: boolean

concurrency:
  group: cloud-run-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: high-ground-odyssey
  GCP_REGION: us-central1
  WIF_PROVIDER: projects/659427658635/locations/global/workloadIdentityPools/github-actions/providers/github
  DEPLOYER_SERVICE_ACCOUNT: github-actions-deployer@high-ground-odyssey.iam.gserviceaccount.com
  NEXT_TELEMETRY_DISABLED: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  plan:
    name: Plan deploy
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.plan.outputs.web }}
      studio: ${{ steps.plan.outputs.studio }}
      schema: ${{ steps.plan.outputs.schema }}
      summary: ${{ steps.plan.outputs.summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Choose deploy targets
        id: plan
        shell: bash
        env:
          TARGET: ${{ github.event.inputs.target || 'auto' }}
        run: |
          set -euo pipefail

          web=false
          studio=false
          schema=false
          summary="No deployable app changes detected."

          case "$TARGET" in
            all)
              web=true
              studio=true
              schema=true
              summary="Manual deploy requested for web and studio."
              ;;
            web)
              web=true
              summary="Manual deploy requested for web."
              ;;
            studio)
              studio=true
              schema=true
              summary="Manual deploy requested for studio."
              ;;
            auto)
              base="${{ github.event.before }}"

              if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
                base="$(git rev-parse "${GITHUB_SHA}^")"
              fi

              node scripts/ci/plan-changed-surfaces.mjs \
                --base "$base" \
                --head "$GITHUB_SHA" \
                --github-output "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "Unknown target: $TARGET" >&2
              exit 1
              ;;
          esac

          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "studio=$studio" >> "$GITHUB_OUTPUT"
          echo "schema=$schema" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          echo "$summary"
          echo "web=$web"
          echo "studio=$studio"
          echo "schema=$schema"

  deploy-web:
    name: Deploy web
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Deploy web Cloud Run Preview & Smoke
        env:
          GCLOUD_PROJECT: ${{ env.GCP_PROJECT }}
          WEB_CLOUD_RUN_PROJECT: ${{ env.GCP_PROJECT }}
          WEB_CLOUD_RUN_REGION: ${{ env.GCP_REGION }}
          WEB_IMAGE_TAG: ${{ github.sha }}
          WEB_IMAGE_BUILD_STRATEGY: docker
        run: pnpm web:cloudrun:deploy

      - name: Promote Web Preview to Production
        env:
          PROJECT_ID: ${{ env.GCP_PROJECT }}
          REGION: ${{ env.GCP_REGION }}
        run: bash scripts/release/web-promote-preview.sh

  deploy-studio:
    name: Deploy studio
    needs: plan
    if: needs.plan.outputs.studio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Run Release Preflight
        env:
          PROJECT_ID: ${{ env.GCP_PROJECT }}
          REGION: ${{ env.GCP_REGION }}
        run: bash scripts/release/quipsly-release-preflight.sh

      - name: Materialize Exact Quipsly Release Context
        run: |
          set -euo pipefail
          release_context="$(bash scripts/release/quipsly-build-context.sh "${GITHUB_SHA}")"
          echo "QUIPSLY_RELEASE_CONTEXT=${release_context}" >>"${GITHUB_ENV}"

      - name: Refuse unapproved schema changes
        if: needs.plan.outputs.schema == 'true' && inputs.apply_schema_changes != true
        run: |
          echo "This release includes schema-owned changes." >&2
          echo "Re-run manually with apply_schema_changes enabled after reviewing committed migrations and targeted syncs." >&2
          exit 1

      - name: Apply committed Prisma migrations
        if: needs.plan.outputs.schema == 'true' && inputs.apply_schema_changes == true
        env:
          PROJECT_ID: ${{ env.GCP_PROJECT }}
          REGION: ${{ env.GCP_REGION }}
          MODE: migrate
          IMAGE_TAG: ${{ github.sha }}
          SOURCE_REF: ${{ github.sha }}
        run: bash scripts/release/quipsly-schema-job.sh

      - name: Apply targeted additive schema syncs
        if: needs.plan.outputs.schema == 'true' && inputs.apply_schema_changes == true
        env:
          PROJECT_ID: ${{ env.GCP_PROJECT }}
          REGION: ${{ env.GCP_REGION }}
          MODE: targeted
          IMAGE_TAG: ${{ github.sha }}
          SOURCE_REF: ${{ github.sha }}
          SKIP_BUILD: "1"
        run: bash scripts/release/quipsly-schema-job.sh

      - name: Build Studio Image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/high-ground-studio/studio:${{ github.sha }}
          LATEST_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/high-ground-studio/studio:latest
        run: |
          set -euo pipefail
          test -f "${QUIPSLY_RELEASE_CONTEXT}/quipsly-release-source.json"
          docker buildx build \
            --file "${QUIPSLY_RELEASE_CONTEXT}/apps/quipsly/Dockerfile" \
            --build-arg NEXT_PUBLIC_STUDIO_COLLAB_URL=wss://studio-collab-hm2odnvjga-uc.a.run.app \
            --build-arg STUDIO_COLLAB_URL=wss://studio-collab-hm2odnvjga-uc.a.run.app \
            --build-arg QUIPSLY_DOCKER_IGNORE_TYPE_ERRORS=0 \
            --build-arg QUIPSLY_BUILD_ID="${GITHUB_SHA}" \
            --tag "$IMAGE_URI" \
            --tag "$LATEST_URI" \
            --push \
            "${QUIPSLY_RELEASE_CONTEXT}"

      - name: Deploy Studio Preview Revision
        env:
          PROJECT_ID: ${{ env.GCP_PROJECT }}
          REGION: ${{ env.GCP_REGION }}
          IMAGE_TAG: ${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
          DEPLOYED_BY: "GitHub Actions"
          SKIP_BUILD: "1"
        run: bash scripts/release/quipsly-deploy-preview.sh

      - name: Resolve Preview URL
        run: |
          PREVIEW_URL=$(gcloud run services describe studio --region ${{ env.GCP_REGION }} --format='value(status.traffic[?(@.tag=="quipsly-preview")].url)')
          if [[ -z "$PREVIEW_URL" ]]; then
            SERVICE_URL=$(gcloud run services describe studio --region ${{ env.GCP_REGION }} --format='value(status.url)')
            SERVICE_HOST="${SERVICE_URL#https://}"
            PREVIEW_URL="https://quipsly-preview---${SERVICE_HOST}"
          fi
          echo "Resolved PREVIEW_URL: $PREVIEW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"

      - name: Smoke Test Preview
        run: bash scripts/release/quipsly-smoke-preview.sh

      - name: Promote Preview to Production
        env:
          REGION: ${{ env.GCP_REGION }}
        run: bash scripts/release/quipsly-promote-preview.sh
