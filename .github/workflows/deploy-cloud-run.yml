name: Deploy Cloud Run

on:
  workflow_dispatch:
    inputs:
      target:
        description: Cloud Run service to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - web
          - studio
          - auto
      apply_schema_changes:
        description: Guard, back up, apply, and verify committed Prisma migrations
        required: true
        default: false
        type: boolean
      source_ref:
        description: Exact committed source ref for a Studio release (defaults to this workflow ref)
        required: false
        default: ""
        type: string
      run_authenticated_smoke:
        description: Run the signed-in preview acceptance gate
        required: true
        default: false
        type: boolean
      promote:
        description: Promote the proven immutable preview to production
        required: true
        default: false
        type: boolean

concurrency:
  group: cloud-run-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: high-ground-odyssey
  GCP_REGION: us-central1
  WIF_PROVIDER: projects/659427658635/locations/global/workloadIdentityPools/github-actions/providers/github
  DEPLOYER_SERVICE_ACCOUNT: github-actions-deployer@high-ground-odyssey.iam.gserviceaccount.com
  NEXT_TELEMETRY_DISABLED: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  plan:
    name: Plan deploy
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.plan.outputs.web }}
      studio: ${{ steps.plan.outputs.studio }}
      schema: ${{ steps.plan.outputs.schema }}
      summary: ${{ steps.plan.outputs.summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Choose deploy targets
        id: plan
        shell: bash
        env:
          TARGET: ${{ github.event.inputs.target || 'auto' }}
          APPLY_SCHEMA_CHANGES: ${{ inputs.apply_schema_changes }}
          RUN_AUTHENTICATED_SMOKE: ${{ inputs.run_authenticated_smoke }}
          PROMOTE: ${{ inputs.promote }}
        run: |
          set -euo pipefail

          web=false
          studio=false
          schema=false
          summary="No deployable app changes detected."

          if [[ "$TARGET" == "auto" && "$PROMOTE" == "true" ]]; then
            echo "Automatic planning cannot authorize production promotion; choose an explicit target." >&2
            exit 1
          fi

          case "$TARGET" in
            all)
              web=true
              studio=true
              schema="$APPLY_SCHEMA_CHANGES"
              summary="Manual deploy requested for web and studio."
              ;;
            web)
              web=true
              summary="Manual deploy requested for web."
              ;;
            studio)
              studio=true
              schema="$APPLY_SCHEMA_CHANGES"
              summary="Manual deploy requested for studio."
              ;;
            auto)
              base="${{ github.event.before }}"

              if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
                base="$(git rev-parse "${GITHUB_SHA}^")"
              fi

              node --experimental-strip-types scripts/ci/plan-changed-surfaces.mjs \
                --base "$base" \
                --head "$GITHUB_SHA" \
                --github-output "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "Unknown target: $TARGET" >&2
              exit 1
              ;;
          esac

          if [[ "$studio" == "true" && "$PROMOTE" == "true" && "$RUN_AUTHENTICATED_SMOKE" != "true" ]]; then
            echo "Studio production promotion requires run_authenticated_smoke=true." >&2
            exit 1
          fi

          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "studio=$studio" >> "$GITHUB_OUTPUT"
          echo "schema=$schema" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          echo "$summary"
          echo "web=$web"
          echo "studio=$studio"
          echo "schema=$schema"

  deploy-web:
    name: Deploy web
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Deploy web Cloud Run Preview & Smoke
        env:
          GCLOUD_PROJECT: ${{ env.GCP_PROJECT }}
          WEB_CLOUD_RUN_PROJECT: ${{ env.GCP_PROJECT }}
          WEB_CLOUD_RUN_REGION: ${{ env.GCP_REGION }}
          WEB_IMAGE_TAG: ${{ github.sha }}
          WEB_IMAGE_BUILD_STRATEGY: docker
        run: pnpm web:cloudrun:deploy

      - name: Promote Web Preview to Production
        if: inputs.promote == true
        env:
          PROJECT_ID: ${{ env.GCP_PROJECT }}
          REGION: ${{ env.GCP_REGION }}
        run: bash scripts/release/web-promote-preview.sh

  deploy-studio:
    name: Deploy studio
    needs: plan
    if: needs.plan.outputs.studio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Resolve Exact Studio Release Source
        shell: bash
        env:
          REQUESTED_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          source_ref="${REQUESTED_SOURCE_REF:-$GITHUB_SHA}"
          source_sha="$(git rev-parse --verify "${source_ref}^{commit}")"
          git cat-file -e "${source_sha}^{commit}"
          echo "RELEASE_SOURCE_SHA=${source_sha}" >> "$GITHUB_ENV"
          echo "Resolved exact Studio release source ${source_sha}."

      - name: Run Release Preflight
        env:
          PROJECT_ID: ${{ env.GCP_PROJECT }}
          REGION: ${{ env.GCP_REGION }}
          QUIPSLY_PREFLIGHT_PURPOSE: preview
        run: |
          SOURCE_REF="$RELEASE_SOURCE_SHA" \
            bash scripts/release/quipsly-release-preflight.sh

      - name: Materialize Exact Quipsly Release Context
        run: |
          set -euo pipefail
          release_context="$(bash scripts/release/quipsly-build-context.sh "${RELEASE_SOURCE_SHA}")"
          echo "QUIPSLY_RELEASE_CONTEXT=${release_context}" >>"${GITHUB_ENV}"

      - name: Refuse unapproved schema changes
        if: needs.plan.outputs.schema == 'true' && inputs.apply_schema_changes != true
        run: |
          echo "This release includes schema-owned changes." >&2
          echo "Re-run manually with apply_schema_changes enabled after reviewing the committed migrations and guarded schema-release plan." >&2
          exit 1

      - name: Guard and apply committed Prisma migrations
        if: needs.plan.outputs.schema == 'true' && inputs.apply_schema_changes == true
        env:
          PROJECT_ID: ${{ env.GCP_PROJECT }}
          REGION: ${{ env.GCP_REGION }}
        run: |
          bash scripts/release/quipsly-schema-release.sh \
            --revision "$RELEASE_SOURCE_SHA" \
            --output "$RUNNER_TEMP/quipsly-schema-release.json" \
            --apply \
            --confirm-target "${GCP_PROJECT}/studio-postgres"

      - name: Preserve schema release receipt
        if: always() && needs.plan.outputs.schema == 'true' && inputs.apply_schema_changes == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quipsly-schema-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quipsly-schema-release.json
          if-no-files-found: error
          retention-days: 90

      - name: Resolve Existing Studio Image
        run: |
          set -euo pipefail
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/high-ground-studio/studio:source-${RELEASE_SOURCE_SHA}"
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          if digest="$(gcloud artifacts docker images describe "$IMAGE_URI" --format='value(image_summary.digest)' 2>"$error_file")"; then
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "Artifact Registry returned an invalid Studio digest." >&2
              exit 1
            }
            echo "STUDIO_IMAGE_EXISTS=1" >> "$GITHUB_ENV"
            echo "Reusing exact-source Studio image ${IMAGE_URI} at ${digest}."
          elif grep -Eqi 'NOT_FOUND|not found|does not exist|was not found' "$error_file"; then
            echo "STUDIO_IMAGE_EXISTS=0" >> "$GITHUB_ENV"
            echo "No exact-source Studio image exists; one build is required."
          else
            echo "Artifact Registry readback failed before the build decision." >&2
            sed -n '1,12p' "$error_file" >&2
            exit 1
          fi

      - name: Build Studio Image
        if: env.STUDIO_IMAGE_EXISTS != '1'
        run: |
          set -euo pipefail
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/high-ground-studio/studio:source-${RELEASE_SOURCE_SHA}"
          test -f "${QUIPSLY_RELEASE_CONTEXT}/quipsly-release-source.json"
          docker buildx build \
            --file "${QUIPSLY_RELEASE_CONTEXT}/apps/quipsly/Dockerfile" \
            --build-arg NEXT_PUBLIC_STUDIO_COLLAB_URL=wss://studio-collab-hm2odnvjga-uc.a.run.app \
            --build-arg STUDIO_COLLAB_URL=wss://studio-collab-hm2odnvjga-uc.a.run.app \
            --build-arg QUIPSLY_DOCKER_IGNORE_TYPE_ERRORS=0 \
            --build-arg QUIPSLY_BUILD_ID="${RELEASE_SOURCE_SHA}" \
            --tag "$IMAGE_URI" \
            --push \
            "${QUIPSLY_RELEASE_CONTEXT}"

      - name: Deploy Studio Preview Revision
        env:
          PROJECT_ID: ${{ env.GCP_PROJECT }}
          REGION: ${{ env.GCP_REGION }}
          DEPLOYED_BY: "GitHub Actions"
          SKIP_BUILD: "1"
        run: |
          IMAGE_TAG="source-$RELEASE_SOURCE_SHA" \
            SOURCE_SHA="$RELEASE_SOURCE_SHA" \
            SOURCE_REF="$RELEASE_SOURCE_SHA" \
            bash scripts/release/quipsly-deploy-preview.sh

      - name: Resolve Preview URL
        run: |
          PREVIEW_URL=$(gcloud run services describe studio --region ${{ env.GCP_REGION }} --format='value(status.traffic[?(@.tag=="quipsly-preview")].url)')
          if [[ -z "$PREVIEW_URL" ]]; then
            SERVICE_URL=$(gcloud run services describe studio --region ${{ env.GCP_REGION }} --format='value(status.url)')
            SERVICE_HOST="${SERVICE_URL#https://}"
            PREVIEW_URL="https://quipsly-preview---${SERVICE_HOST}"
          fi
          echo "Resolved PREVIEW_URL: $PREVIEW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"

      - name: Read Back Preview Source and Safety Boundary
        shell: bash
        run: |
          set -euo pipefail
          receipt="$(mktemp)"
          service="$(mktemp)"
          trap 'rm -f "$receipt" "$service"' EXIT
          curl -fsS --max-time 30 "${PREVIEW_URL}/api/healthz" -o "$receipt"
          gcloud run services describe studio \
            --project="${GCP_PROJECT}" \
            --region="${GCP_REGION}" \
            --format=json >"$service"
          node - "$receipt" "$service" "$RELEASE_SOURCE_SHA" <<'NODE'
          const fs = require("node:fs");
          const body = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const service = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const expectedSource = process.argv[4];
          if (body?.ok !== true) throw new Error("Preview health did not return ok:true.");
          if (body?.release?.sourceSha !== expectedSource) {
            throw new Error(
              `Preview source ${body?.release?.sourceSha || "<missing>"} does not match ${expectedSource}.`,
            );
          }
          if (body?.release?.releaseChannel !== "preview") {
            throw new Error("Preview release channel is not preview.");
          }
          if (!body?.runtime?.revisionName) {
            throw new Error("Preview health omitted its immutable revision name.");
          }
          const previewTraffic = (service?.status?.traffic || []).find(
            (entry) => entry?.tag === "quipsly-preview",
          );
          if (previewTraffic?.revisionName !== body.runtime.revisionName) {
            throw new Error("Mutable preview tag does not resolve to the exercised revision.");
          }
          if (Number(previewTraffic?.percent || 0) !== 0) {
            throw new Error("Preview revision unexpectedly receives production traffic.");
          }
          process.stdout.write(
            `Preview ${body.runtime.revisionName} serves exact source ${expectedSource} at 0% traffic.\n`,
          );
          NODE

      - name: Load Release Smoke Signing Secret
        if: inputs.run_authenticated_smoke == true
        shell: bash
        run: |
          set -euo pipefail
          value="$(
            gcloud secrets versions access latest \
              --secret=quipsly-release-smoke-secret \
              --project="${GCP_PROJECT}"
          )"
          test -n "$value"
          echo "::add-mask::$value"
          echo "QUIPSLY_RELEASE_SMOKE_SECRET=$value" >> "$GITHUB_ENV"

      - name: Smoke Test Preview
        if: inputs.run_authenticated_smoke == true
        env:
          QUIPSLY_AUTH_SMOKE_EMAIL: ${{ secrets.QUIPSLY_AUTH_SMOKE_EMAIL }}
          QUIPSLY_AUTH_SMOKE_PASSWORD: ${{ secrets.QUIPSLY_AUTH_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${QUIPSLY_AUTH_SMOKE_EMAIL}"
          test -n "${QUIPSLY_AUTH_SMOKE_PASSWORD}"
          bash scripts/release/quipsly-smoke-preview.sh

      - name: Promote Preview to Production
        if: inputs.promote == true
        env:
          REGION: ${{ env.GCP_REGION }}
          QUIPSLY_AUTH_SMOKE_EMAIL: ${{ secrets.QUIPSLY_AUTH_SMOKE_EMAIL }}
          QUIPSLY_AUTH_SMOKE_PASSWORD: ${{ secrets.QUIPSLY_AUTH_SMOKE_PASSWORD }}
        run: |
          SOURCE_REF="$RELEASE_SOURCE_SHA" \
            bash scripts/release/quipsly-promote-preview.sh
