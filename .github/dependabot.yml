version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    open-pull-requests-limit: 5
    groups:
      safe-node-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Denver
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci

  - package-ecosystem: bundler
    directory: /apps/mobile-capture/HighGroundCapture
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps(capture)

  - package-ecosystem: docker
    directory: /apps/quipsly
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps(nest)
