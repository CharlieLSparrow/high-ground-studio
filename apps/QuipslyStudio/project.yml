name: QuipslyStudio
options:
  bundleIdPrefix: com.highground
packages:
  QuipslyVideoCore:
    path: Sources/QuipslyVideoCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    majorVersion: 11.0.0
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift-xcframework.git
    exactVersion: 2.15.1

targets:
  QuipslyMac:
    type: application
    platform: macOS
    sources: [Sources/QuipslyMac, Sources/SharedUI]
    dependencies:
      - package: QuipslyVideoCore
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseVertexAI
      - package: LiveKit
        product: LiveKit
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.highground.QuipslyMac
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Sources/QuipslyMac/QuipslyMac.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Quipsly Studio
        INFOPLIST_KEY_CFBundleName: Quipsly Studio
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSCameraUsageDescription: Quipsly Studio uses the camera you explicitly select for episode framing and locally recorded source media.
        INFOPLIST_KEY_NSCameraUseContinuityCameraDeviceType: true
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Quipsly Studio records the microphone you explicitly select as an untouched local episode master and call source.
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: Quipsly Studio can import documents you choose for writing, research, and production work.
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: Quipsly Studio can import downloaded media or research files that you choose.
        INFOPLIST_KEY_NSRemovableVolumesUsageDescription: Quipsly Studio needs access to external media drives so it can read originals, build proxies, and export episodes without mutating source files.
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: Quipsly Studio can read legacy media or export packets from Desktop when you explicitly grant access.

  QuipslyiOS:
    type: application
    platform: iOS
    sources: [Sources/QuipslyiOS, Sources/SharedUI]
    dependencies:
      - package: QuipslyVideoCore
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseVertexAI
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.highground.QuipslyiOS
        GENERATE_INFOPLIST_FILE: YES
