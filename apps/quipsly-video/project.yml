name: QuipslyVideoApp
options:
  bundleIdPrefix: com.highground
packages:
  QuipslyVideoCore:
    path: Packages/QuipslyVideoCore

targets:
  QuipslyVideoMac:
    type: application
    platform: macOS
    sources: [Sources/QuipslyVideoMac]
    dependencies:
      - package: QuipslyVideoCore
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.highground.QuipslyVideoMac
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: QuipslyVideoMac.entitlements

  QuipslyVideoMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Sources/QuipslyVideoMacUITests]
    dependencies:
      - target: QuipslyVideoMac
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.highground.QuipslyVideoMacUITests
        GENERATE_INFOPLIST_FILE: YES

  QuipslyVideoiOS:
    type: application
    platform: iOS
    sources: [Sources/QuipslyVideoiOS]
    dependencies:
      - package: QuipslyVideoCore
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.highground.QuipslyVideoiOS
        GENERATE_INFOPLIST_FILE: YES
